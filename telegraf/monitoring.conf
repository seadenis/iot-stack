[agent]
  interval = "30s"
  round_interval = true
  flush_interval = "10s"
  flush_jitter = "1s"
  metric_batch_size = 100
  metric_buffer_limit = 5000
  omit_hostname = true

# External monitoring metrics arrive from HOME over MQTT.
#
# QoS 1 + persistent_session + stable client_id allow Mosquitto to keep
# unacknowledged messages while this consumer or InfluxDB is temporarily
# unavailable.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]

  topics = [
    "monitoring/dansu/home/metrics",
  ]

  topic_tag = ""

  qos = 1
  persistent_session = true
  client_id = "dansu-monitoring-ingest-v1"

  connection_timeout = "5s"
  keepalive = "30s"
  ping_timeout = "10s"

  max_undelivered_messages = 1000

  username = "monitor-ingest"
  password = "${MONITORING_MQTT_PASSWORD}"

  data_format = "influx"

# Dedicated InfluxDB database and least-privilege writer.
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]

  database = "monitoring"
  retention_policy = "raw_180d"
  skip_database_creation = true

  username = "monitoring_wr"
  password = "${INFLUX_MONITORING_PASSWORD}"

  timeout = "5s"
