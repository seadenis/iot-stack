[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"

# ================ INPUTS =========================
[[inputs.cpu]]        percpu=false totalcpu=true
[[inputs.mem]]
[[inputs.disk]]       ignore_fs=["tmpfs","devtmpfs"]
#[[inputs.net]]
[[inputs.nstat]]
  proc_net_netstat = "/proc/net/netstat"
  proc_net_snmp = "/proc/net/snmp"
[[inputs.system]]
[[inputs.nginx]]
  urls = ["http://127.0.0.1:8080/nginx_status"]
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"

  container_name_include = [
    "mosquitto",
    "influxdb",
    "mqtt2influx",
    "kapacitor",
    "grafana",
    "nginx",
    "telegraf",
  ]

  # Keep status metrics for containers that stopped or are restarting too.
  container_state_include = [
    "created",
    "restarting",
    "running",
    "removing",
    "paused",
    "exited",
    "dead",
  ]

  # We need totals, not per-interface/per-device cardinality.
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]

  # Do not export the large collection of Compose/image labels.
  docker_label_include = [
    "com.docker.compose.project",
    "com.docker.compose.service",
  ]

  timeout = "5s"

#[[inputs.systemd_units]]
#unit_include=["mosquitto.service","influxdb.service"]

# ================ OUTPUT InfluxDB (локальный) ===
#[[outputs.influxdb]]
#  urls   = ["http://localhost:8086"]
#  database = "server_metrics"
#  skip_database_creation = true

# ================ OUTPUT MQTT ====================
[[outputs.mqtt]]
  servers        = ["tcp://localhost:1883"]            # внешний брокер
#  topic          = "vps/metrics"
  username       = "telegraf_pub"
  password       = "$MQTT_PW"
  qos            = 1
  retain         = false
  data_format    = "json"
