server_tokens off;

# Reject unknown HTTP Host headers.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Valid public hostnames.
server {
    listen 80;
    server_name dansu.ru www.dansu.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/conf.d/acme-webroot;
        try_files $uri =404;
    }

    location / {
        return 301 https://dansu.ru$request_uri;
    }
}

# Reject unknown HTTPS Host headers.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/dansu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dansu.ru/privkey.pem;

    return 444;
}

# Canonical hostname.
server {
    listen 443 ssl;
    http2 on;
    server_name www.dansu.ru;

    ssl_certificate     /etc/letsencrypt/live/dansu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dansu.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    return 301 https://dansu.ru$request_uri;
}

# Main site / Grafana.
server {
    listen 443 ssl;
    http2 on;
    server_name dansu.ru;

    ssl_certificate     /etc/letsencrypt/live/dansu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dansu.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /api/live/ws {
        return 404;
    }

    # Public entry point. Use 302 because the external-share token may change.
    location = / {
        return 302 /public-dashboards/81325cdc82f348989fad5e345bf26105;
    }

    location / {
        proxy_pass       http://grafana:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
