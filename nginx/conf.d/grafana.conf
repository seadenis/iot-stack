server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;

# Public dashboard protection.
#
# Public dashboard rate limiting is enforced.
# Requests exceeding the configured limits receive HTTP 429.
#
# Per-client key.
# $dansu_rate_limit_bypass is defined by a production-only nginx file.
# Trusted clients receive an empty key and are excluded from this zone.
map $dansu_rate_limit_bypass $dansu_public_client_key {
    1 "";
    default $binary_remote_addr;
}

# Site-wide key.
# Trusted clients receive an empty key here as well, so their requests
# neither consume nor are constrained by the global public bucket.
map $dansu_rate_limit_bypass $dansu_public_global_key {
    1 "";
    default "public";
}

# A normal dashboard load can issue many panel queries at once, therefore
# the per-client burst is deliberately much larger than the sustained rate.
limit_req_zone $dansu_public_client_key
    zone=dansu_public_per_ip:10m
    rate=10r/s;

# Global protection for Grafana/InfluxDB.
limit_req_zone $dansu_public_global_key
    zone=dansu_public_global:1m
    rate=40r/s;

# Reject unknown HTTP Host headers.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Valid public hostnames.
server {
    listen 80;
    server_name dansu.ru www.dansu.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/conf.d/acme-webroot;
        try_files $uri =404;
    }

    location / {
        return 301 https://dansu.ru$request_uri;
    }
}

# Reject unknown HTTPS Host headers.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/dansu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dansu.ru/privkey.pem;

    return 444;
}

# Canonical hostname.
server {
    listen 443 ssl;
    http2 on;
    server_name www.dansu.ru;

    ssl_certificate     /etc/letsencrypt/live/dansu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dansu.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    return 301 https://dansu.ru$request_uri;
}

# Main site / Grafana.
server {
    listen 443 ssl;
    http2 on;
    server_name dansu.ru;

    ssl_certificate     /etc/letsencrypt/live/dansu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dansu.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: mailto:sea.denis@gmail.com\nExpires: 2027-08-29T00:00:00Z\nPreferred-Languages: ru, en\nCanonical: https://dansu.ru/.well-known/security.txt\n";
    }

    location = /api/live/ws {
        return 404;
    }

    # Internal Grafana operational endpoints are not part of the public site.
    location = /metrics {
        return 404;
    }

    location ^~ /metrics/ {
        return 404;
    }

    location = /api/health {
        return 404;
    }

    location ^~ /api/health/ {
        return 404;
    }

    location = /swagger {
        return 404;
    }

    location ^~ /swagger/ {
        return 404;
    }

    location = /swagger-ui {
        return 404;
    }

    location ^~ /swagger-ui/ {
        return 404;
    }

    location = /api/swagger.json {
        return 404;
    }

    location = /api/swagger.yaml {
        return 404;
    }

    # Grafana administration is available only through the local
    # Grafana listener, typically reached through an SSH tunnel.
    location = /login {
        return 404;
    }

    location ^~ /login/ {
        return 404;
    }

    location = /api/login {
        return 404;
    }

    location ^~ /api/login/ {
        return 404;
    }

    # Expensive public-dashboard datasource requests.
    #
    # DRY RUN:
    # - per client: 10 requests/s, burst 48
    # - whole public site: 40 requests/s, burst 80
    #
    # No request is rejected at this stage. nginx only records requests
    # that would have been rate-limited.
    location ~ ^/api/public/dashboards/[^/]+/panels/[0-9]+/query$ {
        limit_req zone=dansu_public_per_ip burst=48 nodelay;
        limit_req zone=dansu_public_global burst=80 nodelay;

        limit_req_status 429;
        limit_req_log_level notice;
        limit_req_dry_run off;

        proxy_pass       http://grafana:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Public entry point. Use 302 because the external-share token may change.
    location = / {
        return 302 "/public-dashboards/81325cdc82f348989fad5e345bf26105?from=now-7d&to=now&refresh=15m";
    }

    # Public dashboard: keep Grafana functionality but use the site title
    # instead of the generic "Grafana" browser-tab title.
    location ^~ /public-dashboards/ {
        proxy_pass       http://grafana:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Allow nginx sub_filter to process the upstream HTML.
        proxy_set_header Accept-Encoding "";

        sub_filter '<title>Grafana</title>' '<title>Муравская</title>';

        # Grafana public-dashboard frontend resets document.title to "Grafana"
        # after the application starts. Install the title guard inside Grafana's
        # existing CSP-nonced bootstrap script, so CSP does not need weakening.
        sub_filter 'window.grafanaBootData = {' 'const dansuTitle=document.querySelector("title");if(dansuTitle){new MutationObserver(()=>{if(dansuTitle.textContent!=="Муравская"){dansuTitle.textContent="Муравская";}}).observe(dansuTitle,{childList:true,characterData:true,subtree:true});} window.grafanaBootData = {';

        sub_filter_once off;
    }

    location / {
        proxy_pass       http://grafana:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
